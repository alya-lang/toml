name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Test on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Alya Compiler
        uses: actions/cache@v4
        id: cache-alyac
        with:
          path: ~/.cargo/bin/alyac*
          key: ${{ runner.os }}-alyac-compiler-v0.0.5-20260911

      - name: Install Alya Compiler (alyac)
        if: steps.cache-alyac.outputs.cache-hit != 'true'
        shell: bash
        run: |
          cargo install --git https://github.com/alya-lang/alya --branch main --bin alyac

      - name: Verify alyac installation
        run: |
          alyac --version

      - name: Check package manifest
        run: |
          alyac pkg list

      - name: Run package test suite
        run: |
          alyac run tests/test_basic.alya
