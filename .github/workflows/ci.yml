name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Test on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Get latest Alya compiler commit SHA
        id: alya-sha
        shell: bash
        run: |
          SHA=$(git ls-remote https://github.com/alya-lang/alya refs/heads/main | cut -f1)
          echo "Resolved Alya main commit: $SHA"
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"

      - name: Cache Alya Compiler
        uses: actions/cache@v4
        id: cache-alyac
        with:
          path: ~/.cargo/bin/alyac*
          key: ${{ runner.os }}-alyac-${{ steps.alya-sha.outputs.sha }}

      - name: Install Alya Compiler (alyac)
        if: steps.cache-alyac.outputs.cache-hit != 'true'
        shell: bash
        run: |
          cargo install --git https://github.com/alya-lang/alya --branch main --bin alyac

      - name: Verify alyac installation
        run: |
          alyac --version

      - name: Check package manifest
        run: |
          alyac pkg list

      - name: Run package test suite
        run: |
          alyac run tests/test_basic.alya
